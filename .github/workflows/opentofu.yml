---
name: Validate OpenTofu

on:
  pull_request:
    branches: [master]
    paths:
      - "config/opentofu/**"
      - ".github/workflows/opentofu.yml"
  push:
    branches: [master]
    paths:
      - "config/opentofu/**"
      - ".github/workflows/opentofu.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate OpenTofu configuration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: config/opentofu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Set provider validation environment
        run: |
          echo "AWS_ACCESS_KEY_ID=ci-validation" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=ci-validation" >> "$GITHUB_ENV"
          echo "AWS_EC2_METADATA_DISABLED=true" >> "$GITHUB_ENV"

      - name: Create temporary SSH key
        run: |
          mkdir -p "$HOME/.ssh"
          ssh-keygen -t ed25519 -N "" -f "$HOME/.ssh/id_rsa" -q

      - name: Create placeholder Talos worker configuration
        run: |
          mkdir -p ../quantum-talos
          touch ../quantum-talos/worker.yaml

      - name: Initialize providers
        run: tofu init -backend=false -input=false

      - name: Validate configuration
        run: tofu validate -no-color -var-file=terraform.tfvars.example
