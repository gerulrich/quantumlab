---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qauth
  namespace: core
  labels:
    app: qauth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qauth
  template:
    metadata:
      labels:
        app: qauth
    spec:
      containers:
      - name: qauth
        image: docker.io/gerulrich/qauth:0.0.5
        env:
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: core-secrets
              key: GOOGLE_CLIENT_ID
        - name: MONGODB_DATABASE
          valueFrom:
            secretKeyRef:
              name: core-secrets
              key: MONGODB_DATABASE
        - name: MONGODB_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: core-secrets
              key: MONGODB_CONNECTION_STRING
        - name: CORS_ORIGINS
          valueFrom:
            secretKeyRef:
              name: core-secrets
              key: CORS_ORIGINS
        - name: JWT_ISSUER
          valueFrom:
            secretKeyRef:
              name: core-secrets
              key: JWT_ISSUER
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - name: secrets-volume
          mountPath: /work/secret.jwk
          subPath: secret.jwk
      volumes:
      - name: secrets-volume
        secret:
          secretName: core-secrets
