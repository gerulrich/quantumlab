---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qmusic
  namespace: core
  labels:
    app: qmusic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qmusic
  template:
    metadata:
      labels:
        app: qmusic
    spec:
      containers:
      - name: qmusic
        image: qmusic:0.0.13
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          timeoutSeconds: 3
        envFrom:
        - secretRef:
            name: core-secrets
        volumeMounts:
        - name: secrets-volume
          mountPath: /work/secret.jwk
          subPath: secret.jwk
      volumes:
      - name: secrets-volume
        secret:
          secretName: core-secrets
