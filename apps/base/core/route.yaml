---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-http-route
  namespace: core
spec:
  parentRefs:
  - name: http-gateway
    namespace: gateway
  hostnames:
  - "api.lan.${DOMAIN}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /music
    backendRefs:
    - name: qmusic
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-http-route
  namespace: core
spec:
  parentRefs:
  - name: tls-gateway
    namespace: gateway
  hostnames:
  - "api.lan.${DOMAIN}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /music
    backendRefs:
    - name: qmusic
      port: 8080
