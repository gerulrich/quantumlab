---
kind: postgresql
apiVersion: acid.zalan.do/v1
metadata:
  name: psql-cluster
  namespace: database
  labels:
    color: blue
spec:
  teamId: "acid"
  postgresql:
    version: "17"
  numberOfInstances: 2
  volume:
    size: "10Gi"
  users:
    # Creates application credential Secrets in the arr-stack namespace.
    arr-stack.radarr: []
    arr-stack.sonarr: []
    arr-stack.prowlarr: []
    arr-stack.seerr: []
  databases:
    radarr: arr-stack.radarr
    radarr_log: arr-stack.radarr
    sonarr: arr-stack.sonarr
    sonarr_log: arr-stack.sonarr
    prowlarr: arr-stack.prowlarr
    prowlarr_log: arr-stack.prowlarr
    seerr: arr-stack.seerr
  allowedSourceRanges:
  - 0.0.0.0/0
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
    limits:
      cpu: 500m
      memory: 500Mi
