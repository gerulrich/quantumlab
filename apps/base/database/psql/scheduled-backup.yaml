---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-production-daily
  namespace: database
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: postgres-production
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
