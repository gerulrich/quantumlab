---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Quantum Lab
    theme: dark
    color: slate
    headerStyle: clean
    fullWidth: true
    statusStyle: dot
    layout:
      Media:
        style: row
        columns: 4

  kubernetes.yaml: |
    mode: cluster

  # empty: apps register themselves via gethomepage.dev/* annotations on their Service
  services.yaml: |
    - Media:
      - Transmission:
          icon: transmission.png
          href: https://transmission.lan.homelab.net.ar
          description: Torrent client
          widget:
            type: transmission
            url: http://transmission.media.svc.cluster.local:9091
            rpcUrl: /transmission/

      - Radarr:
          icon: radarr.png
          href: https://radarr.lan.homelab.net.ar
          description: Movie management
          widget:
            type: radarr
            url: http://radarr.arr-stack.svc.cluster.local:7878
            key: __RADARR_API_KEY__

      - Sonarr:
          icon: sonarr.png
          href: https://sonarr.lan.homelab.net.ar
          description: TV series management
          widget:
            type: sonarr
            url: http://sonarr.arr-stack.svc.cluster.local:8989
            key: __SONARR_API_KEY__

      - Prowlarr:
          icon: prowlarr.png
          href: https://prowlarr.lan.homelab.net.ar
          description: Indexer management
          widget:
            type: prowlarr
            url: http://prowlarr.arr-stack.svc.cluster.local:9696
            key: __PROWLARR_API_KEY__

      - Seerr:
          icon: seerr.png
          href: https://seerr.lan.homelab.net.ar
          description: Media discovery and management
          widget:
            type: seerr
            url: http://seerr.arr-stack.svc.cluster.local:5055
            key: __SEERR_API_KEY__
  bookmarks.yaml: ""
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
  docker.yaml: ""
