---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      initContainers:
        - name: render-config
          image: alpine:3.24
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              cp /config-template/* /config/
              for key in RADARR_API_KEY SONARR_API_KEY PROWLARR_API_KEY SEERR_API_KEY; do
                value="$(cat "/secrets/$${key}")"
                escaped_value="$(printf '%s' "$${value}" | sed -e 's/[&|\\]/\\&/g')"
                sed -i "s|__$${key}__|$${escaped_value}|g" /config/services.yaml
              done
          volumeMounts:
            - name: config-template
              mountPath: /config-template
              readOnly: true
            - name: homepage-secrets
              mountPath: /secrets
              readOnly: true
            - name: rendered-config
              mountPath: /config
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v1.3.1
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "homepage.lan.${DOMAIN}"
          volumeMounts:
            - name: rendered-config
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
            - name: rendered-config
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml
            - name: rendered-config
              mountPath: /app/config/services.yaml
              subPath: services.yaml
            - name: rendered-config
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml
            - name: rendered-config
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
            - name: rendered-config
              mountPath: /app/config/docker.yaml
              subPath: docker.yaml
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: rendered-config
          emptyDir: {}
        - name: config-template
          configMap:
            name: homepage-config
        - name: homepage-secrets
          secret:
            secretName: homepage-secret
