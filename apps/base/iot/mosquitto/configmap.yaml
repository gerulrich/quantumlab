---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: iot
data:
  mosquitto.conf: |
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout

    allow_anonymous false
    password_file /mosquitto/config/passwordfile
    # acl_file /mosquitto/config/aclfile

    listener 1883
    socket_domain ipv4

    allow_anonymous false
  aclfile: |
    # Usuario mqtt_z2m puede publicar y suscribirse a todo
    user mqtt_z2m
    topic readwrite #
