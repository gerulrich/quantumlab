---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr-http-route
  namespace: arr-stack
spec:
  parentRefs:
  - name: http-gateway
    namespace: gateway
  hostnames:
  - "seerr.lan.${DOMAIN}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: seerr
      port: 5055
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr-tls-route
  namespace: arr-stack
spec:
  parentRefs:
  - name: tls-gateway
    namespace: gateway
  hostnames:
  - "seerr.lan.${DOMAIN}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: seerr
      port: 5055