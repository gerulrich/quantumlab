---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: arr-stack
  labels:
    app: sonarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:4.0.16
          ports:
            - name: http
              containerPort: 8989
          env:
            - name: SONARR__POSTGRES__HOST
              value: psql-cluster.database.svc.cluster.local
            - name: SONARR__POSTGRES__PORT
              value: "5432"
            - name: SONARR__POSTGRES__SSLMODE
              value: Require
            - name: SONARR__POSTGRES__USER
              valueFrom:
                secretKeyRef:
                  name: arr-stack.sonarr.psql-cluster.credentials.postgresql.acid.zalan.do
                  key: username
            - name: SONARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arr-stack.sonarr.psql-cluster.credentials.postgresql.acid.zalan.do
                  key: password
            - name: SONARR__POSTGRES__MAINDB
              value: sonarr
            - name: SONARR__POSTGRES__LOGDB
              value: sonarr_log
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config
