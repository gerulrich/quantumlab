---
apiVersion: v1
kind: Service
metadata:
  name: transmission
  namespace: media
  labels:
    app: transmission
    color: blue
spec:
  type: LoadBalancer
  selector:
    app: transmission
  ports:
    - name: http
      protocol: TCP
      port: 9091
      targetPort: http
    - name: peer-tcp
      protocol: TCP
      port: 51413
      targetPort: peer-tcp
    - name: peer-udp
      protocol: UDP
      port: 51413
      targetPort: peer-udp
