---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocketid
  namespace: oauth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pocketid
  template:
    metadata:
      labels:
        app: pocketid
    spec:
      containers:
        - name: pocketid
          image: ghcr.io/pocket-id/pocket-id:v2.16.0
          env:
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: pocketid-secret
                  key: ENCRYPTION_KEY
            - name: APP_URL
              value: https://id.lan.${DOMAIN}
            - name: RELYING_PARTY_ID
              value: id.lan.${DOMAIN}
            - name: VERSION_CHECK_DISABLED
              value: "true"
            - name: ANALYTICS_DISABLED
              value: "true"
            - name: PSQL_USER
              valueFrom:
                secretKeyRef:
                  name: oauth.pocketid.psql-cluster.credentials.postgresql.acid.zalan.do
                  key: username
            - name: PSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oauth.pocketid.psql-cluster.credentials.postgresql.acid.zalan.do
                  key: password
            - name: DB_CONNECTION_STRING
              value: postgres://$(PSQL_USER):$(PSQL_PASSWORD)@psql-cluster.database.svc.cluster.local:5432/pocketid
          ports:
            - containerPort: 1411
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pocketid-data
