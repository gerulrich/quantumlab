---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-config
  namespace: oauth
data:
  traefik.yaml: |
    entryPoints:
      web:
        address: ":80"
    providers:
      file:
        directory: "/etc/traefik/dynamic"
        watch: true
    log:
      level: INFO
  dynamic.yaml: |
    http:
      middlewares:
        oauth2-proxy:
          forwardAuth:
            # root path (not /oauth2/auth) so oauth2-proxy itself redirects to sign-in on 401
            address: "http://oauth2-proxy.oauth.svc.cluster.local:4180/"
            trustForwardHeader: true
            authResponseHeaders:
              - X-Auth-Request-User
              - X-Auth-Request-Email
              - X-Auth-Request-Access-Token
              - Set-Cookie

      routers:
        pihole:
          rule: "Host(`pihole.lan.${DOMAIN}`)"
          entryPoints:
            - web
          service: pihole

        mqtt:
          rule: "Host(`mqtt.lan.${DOMAIN}`)"
          entryPoints:
            - web
          middlewares:
            - oauth2-proxy
          service: mqtt

        netbootxyz:
          rule: "Host(`netbootxyz.lan.${DOMAIN}`)"
          entryPoints:
            - web
          middlewares:
            - oauth2-proxy
          service: netbootxyz

        longhorn:
          rule: "Host(`longhorn.lan.${DOMAIN}`)"
          entryPoints:
            - web
          middlewares:
            - oauth2-proxy
          service: longhorn

        radarr:
          rule: "Host(`radarr.lan.${DOMAIN}`)"
          entryPoints:
            - web
          middlewares:
            - oauth2-proxy
          service: radarr

        sonarr:
          rule: "Host(`sonarr.lan.${DOMAIN}`)"
          entryPoints:
            - web
          middlewares:
            - oauth2-proxy
          service: sonarr

        prowlarr:
          rule: "Host(`prowlarr.lan.${DOMAIN}`)"
          entryPoints:
            - web
          middlewares:
            - oauth2-proxy
          service: prowlarr

        transmission:
          rule: "Host(`transmission.lan.${DOMAIN}`)"
          entryPoints:
            - web
          middlewares:
            - oauth2-proxy
          service: transmission

      services:
        pihole:
          loadBalancer:
            servers:
              - url: "http://10.10.10.10"

        mqtt:
          loadBalancer:
            servers:
              - url: "http://mqtt-explorer.iot.svc.cluster.local:4000"

        netbootxyz:
          loadBalancer:
            servers:
              - url: "http://netbootxyz.netbootxyz.svc.cluster.local:3000"

        longhorn:
          loadBalancer:
            servers:
              - url: "http://longhorn-frontend.longhorn-system.svc.cluster.local:80"

        radarr:
          loadBalancer:
            servers:
              - url: "http://radarr.arr-stack.svc.cluster.local:7878"

        sonarr:
          loadBalancer:
            servers:
              - url: "http://sonarr.arr-stack.svc.cluster.local:8989"

        prowlarr:
          loadBalancer:
            servers:
              - url: "http://prowlarr.arr-stack.svc.cluster.local:9696"

        transmission:
          loadBalancer:
            servers:
              - url: "http://transmission.media.svc.cluster.local:9091"
