---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-config
  namespace: oauth
data:
  traefik.yaml: |
    entryPoints:
      web:
        address: ":80"
    providers:
      file:
        directory: "/etc/traefik/dynamic"
        watch: true
    log:
      level: INFO
  dynamic.yaml: |
    http:
      middlewares:
        oauth2-proxy:
          forwardAuth:
            # root path (not /oauth2/auth) so oauth2-proxy itself redirects to sign-in on 401
            address: "http://oauth2-proxy.oauth.svc.cluster.local:4180/"
            trustForwardHeader: true
            authResponseHeaders:
              - X-Auth-Request-User
              - X-Auth-Request-Email
              - X-Auth-Request-Access-Token
              - Set-Cookie

      routers:
        pihole:
          rule: "Host(`pihole.lan.${DOMAIN}`)"
          entryPoints:
            - web
          service: pihole

        mqtt:
          rule: "Host(`mqtt.lan.${DOMAIN}`)"
          entryPoints:
            - web
          middlewares:
            - oauth2-proxy
          service: mqtt

        netbootxyz:
          rule: "Host(`netbootxyz.lan.${DOMAIN}`)"
          entryPoints:
            - web
          middlewares:
            - oauth2-proxy
          service: netbootxyz

      services:
        pihole:
          loadBalancer:
            servers:
              - url: "http://10.10.10.10"

        mqtt:
          loadBalancer:
            servers:
              - url: "http://mqtt-explorer.iot.svc.cluster.local:4000"

        netbootxyz:
          loadBalancer:
            servers:
              - url: "http://netbootxyz.netbootxyz.svc.cluster.local:3000"
