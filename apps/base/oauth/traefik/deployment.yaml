---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: oauth
  name: traefik
  labels:
    app: traefik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      containers:
      - name: traefik
        image: traefik:v3.7.11
        args:
        - --configFile=/etc/traefik/traefik.yaml
        ports:
        - containerPort: 80
        volumeMounts:
        - name: traefik-config
          mountPath: /etc/traefik/traefik.yaml
          subPath: traefik.yaml
        - name: traefik-config
          mountPath: /etc/traefik/dynamic/dynamic.yaml
          subPath: dynamic.yaml
      volumes:
      - name: traefik-config
        configMap:
          name: traefik-config
