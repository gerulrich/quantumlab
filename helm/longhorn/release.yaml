---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 24h
  chart:
    spec:
      chart: longhorn
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn-system
      interval: 24h
  values:
    defaultSettings:
      defaultReplicaCount: 2
      defaultDataPath: /var/mnt/longhorn-storage
      backupTarget: s3://backups-homelab@us-ashburn-1/
      backupTargetCredentialSecret: longhorn-backup-secret
      defaultRecurringJobGroup: default
    persistence:
      reclaimPolicy: Retain
      defaultClassReplicaCount: 2
