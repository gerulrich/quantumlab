---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: reflector-system
spec:
  interval: 24h
  chart:
    spec:
      chart: reflector
      version: 10.0.65
      sourceRef:
        kind: HelmRepository
        name: emberstack
        namespace: reflector-system
      interval: 24h
  values:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi