  name: reflector
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: reflector
      version: "10.0.65"
      sourceRef:
        kind: HelmRepository
        name: emberstack
        namespace: kube-system
      interval: 1h